name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  compiler: gcc,   cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest,  compiler: clang, cc: clang, cxx: clang++ }
          - { os: macos-latest,   compiler: clang, cc: clang, cxx: clang++ }
          - { os: windows-latest, compiler: msvc }
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke-test the CLI
        shell: bash
        run: |
          BIN=build/knapsack; [ -x build/Release/knapsack.exe ] && BIN=build/Release/knapsack.exe
          $BIN examples/juice.txt
          $BIN --json examples/wikipedia.txt
